# CRE secrets: one BLS12-381 scalar per denomination, hex, in the range 1 to order-1.
# The values come from workflow/.env (gitignored). `just workflow-env` writes that file
# from FRAMECASH_MINT_BLS in the root .env, so the CRE mint and the local mint hold the
# same keys and sign for the same pool.
secretsNames:
  MINT_KEY_0_001:
    - SECRET_MINT_KEY_0_001
  MINT_KEY_0_01:
    - SECRET_MINT_KEY_0_01
  MINT_KEY_0_1:
    - SECRET_MINT_KEY_0_1
  MINT_KEY_1:
    - SECRET_MINT_KEY_1
