# CRE project settings.
#
# The mint watches FramePool on the EIP-8141 devnet (chain 1337, chain-selectors name
# `geth-testnet`, selector 3379446385462418246) and writes announcements back to it. CRE has
# no forwarder there, so the chain goes under `experimental-chains` with one of ours: a
# DevnetForwarder that `node cli/src/main.ts deploy --cre` deployed and the CRE pool trusts.
# Commands pass --allow-unknown-chains.
devnet-settings:
  experimental-chains:
    - chain-type: evm
      chain-selector: 3379446385462418246
      rpc-url: https://altmempool.forshtat.com
      forwarder: "0x88e93b8df54523b7d45807ec592c99cf6c576ec8"
