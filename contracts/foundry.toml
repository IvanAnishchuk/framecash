[profile.default]
src = "src"
out = "out"
test = "test"
solc = "0.8.28"
# Prague carries the EIP-2537 precompiles in forge's EVM. The devnet runs a newer fork.
evm_version = "prague"
optimizer = true
optimizer_runs = 200
# Tests sign BLS vectors with the TypeScript library (node strips the types itself).
ffi = true
